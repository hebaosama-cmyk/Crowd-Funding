<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Donation</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f8f1f5;
        text-align: center;
        padding: 50px;
    }

    h1 {
        color: #7b3f61;
    }

    h2 {
        color: #444;
    }

    form {
        background-color: white;
        padding: 30px;
        width: 350px;
        margin: 30px auto;
        border-radius: 12px;
    }

    input {
        padding: 10px;
        margin: 15px;
        width: 200px;
    }

    button {
        padding: 10px 25px;
        background-color: #7b3f61;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover {
        background-color: #5e2e49;
    }

    .error {
        color: red;
    }
</style>
</head>

<body>

    <h1>Make a Donation</h1>

    <h2>{{ project.title }}</h2>

    <p>
        <strong>Target:</strong>
        {{ project.total_target }}
    </p>
    {% if error %}
    <p class="error">{{ error }}</p>
{% endif %}
       

    <form method="POST">
        {% csrf_token %}

        <label for="amount">Donation Amount:</label>
        <input type="number" id="amount" name="amount" step="0.01" required>

        <button type="submit">Donate</button>
    </form>

</body>
</html>
